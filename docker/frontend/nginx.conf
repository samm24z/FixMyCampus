# Serves the built SPA and proxies the API to the backend container (same origin, so no CORS).

# Keep the scheme from an HTTPS proxy in front of us; otherwise use our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Docker's embedded DNS; re-resolves `backend` so a restarted backend container is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               text/javascript application/xml image/svg+xml font/ttf;

    # Security headers. (No add_header inside locations below, so these are inherited everywhere.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Container health (does not touch the backend).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Backend API and health check. The URI is passed through unchanged.
    location ~ ^/(api/|health$) {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;   # chatbot replies can take a while
    }

    # Hashed build output: cache for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Never cache the shell, so a new deploy is picked up on the next load.
    location = /index.html {
        expires -1;
    }

    # SPA fallback: /tickets/TICK-123 survives a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
