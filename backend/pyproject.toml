[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fixmycampus-backend"
version = "0.1.0"
description = "FixMyCampus AI Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.0.0",
    "sqlalchemy>=2.0.32",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "pgvector>=0.3.2",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", ".."]
